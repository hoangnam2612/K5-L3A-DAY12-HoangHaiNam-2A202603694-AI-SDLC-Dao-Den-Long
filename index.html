<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <style>
      :root {
        --sky: #0e1430; --fog: #1b2350; --lantern: #ffb347; --core: #ffe9b0; --off: #5b5f6e;
        --mote: #fff6c2; --halo: #ffe58a; --gold: #f2c14e; --danger: #ff5a5f; --text: #f5f1e6; --scarf: #c8102e;
        --font-scale: 1;
      }
      :root.large-text { --font-scale: 1.25; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: var(--sky); color: var(--text);
        font-family: system-ui, "Segoe UI", sans-serif;
        font-size: calc(18px * var(--font-scale));
      }
      canvas { display: block; }

      /* ---------- HUD ---------- */
      #hud-root { position: fixed; inset: 0; pointer-events: none; user-select: none; font-size: 1rem; }
      #hud-root[hidden] { display: none; }
      #hud-tl { position: absolute; top: 14px; left: 18px; }
      #hud-flames { display: flex; gap: 4px; }
      .flame { display: inline-flex; color: var(--lantern); filter: drop-shadow(0 0 6px #ffb34799); }
      .flame.off { color: #3a3450; filter: none; }
      #hud-night { margin-top: 4px; font-size: 1rem; opacity: .9; font-weight: 600; }
      #hud-timer { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font: 700 2rem/1 ui-monospace, Consolas, monospace; letter-spacing: 2px; text-shadow: 0 0 10px #0008; }
      #hud-timer.low { color: var(--danger); animation: blink .6s ease-in-out infinite alternate; }
      :root.reduced-motion #hud-timer.low,
      :root.reduced-motion #warn,
      :root.reduced-motion #warnframe { animation: none !important; }
      #hud-tr { position: absolute; top: 14px; right: 20px; text-align: right; }
      #hud-lanterns { font-size: 1.1rem; color: var(--lantern); font-weight: 700; }
      #hud-score { font: 700 1.7rem/1.1 ui-monospace, Consolas, monospace; color: var(--gold); }
      :root.cb { --danger: #ffffff; }
      :root.cb #hud-timer.low::before { content: "⚠ "; }
      #hud-objective { font-size: 1rem; opacity: .9; margin-top: 2px; }
      #hud-subtitles {
        position: absolute; top: 76px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        max-width: 82vw; text-align: center;
      }
      #hud-subtitles[hidden] { display: none; }
      .sub-line {
        padding: 6px 16px; border-radius: 999px;
        background: rgba(14, 20, 48, 0.88); border: 1px solid var(--gold);
        color: var(--text); font-size: 1rem; font-weight: 600;
        box-shadow: 0 2px 10px #000a;
      }
      #hud-carry { position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%); font: 700 1rem ui-monospace, Consolas, monospace; color: var(--core); text-shadow: 0 0 6px #000a; }
      label.check { align-items: center; }
      label.check input { width: 22px; height: 22px; accent-color: var(--lantern); }
      #hud-prompt { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); padding: 8px 20px; border-radius: 999px; background: #0e1430dd; border: 1px solid var(--gold); color: var(--core); font-size: 1rem; font-weight: 700; }
      #hud-prompt[hidden] { display: none; }
      #hud-motes { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
      .cell[hidden] { display: none; }
      .cell { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--gold); background: #0e143099; }
      .cell.on { background: radial-gradient(circle, var(--mote) 30%, var(--halo) 100%); box-shadow: 0 0 10px var(--halo); }
      #hud-br { position: absolute; bottom: 22px; right: 22px; display: flex; gap: 14px; align-items: flex-end; }
      #hud-charm { position: absolute; right: 0; bottom: 96px; width: 190px; text-align: right; color: var(--gold); font-size: 1rem; font-weight: 700; }
      .cd { position: relative; width: 72px; height: 72px; border-radius: 50%; background: #0e1430cc; border: 2px solid var(--gold); text-align: center; }
      .cd.ready { box-shadow: 0 0 12px var(--gold); }
      .cd-ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(#000a var(--p, 0deg), transparent 0); }
      .cd-key { position: absolute; top: 8px; left: 0; right: 0; font: 700 1.15rem/1 ui-monospace, Consolas, monospace; color: var(--core); }
      .cd-label { position: absolute; bottom: 7px; left: 0; right: 0; font-size: 0.78rem; opacity: .9; }
      .cd-time { position: absolute; top: 32px; left: 0; right: 0; font: 700 0.9rem/1 ui-monospace, Consolas, monospace; color: var(--text); }
      #hud-arrow, #hud-shade-arrow { position: absolute; left: 0; top: 0; margin: -18px 0 0 -18px; text-align: center; filter: drop-shadow(0 0 6px #000a); }
      #hud-arrow { color: var(--lantern); }
      #hud-shade-arrow { color: var(--danger); }
      #hud-arrow[hidden], #hud-shade-arrow[hidden] { display: none; }
      #hud-arrow svg, #hud-shade-arrow svg { display: block; margin: 0 auto; transition: transform .05s linear; }
      #hud-arrow-label, #hud-shade-arrow-label { font-size: 0.9rem; font-weight: 700; }
      #hud-fps { position: absolute; top: 82px; left: 18px; font: 0.85rem ui-monospace, Consolas, monospace; opacity: .85; }

      /* ---------- Cảnh báo lốc xoáy ---------- */
      #warn { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); padding: 10px 26px; border-radius: 999px; background: #c0141fe6; color: #fff; font: 700 1.1rem system-ui, sans-serif; white-space: nowrap; letter-spacing: .5px; pointer-events: none; box-shadow: 0 0 30px #ff2a2a; animation: blink .5s ease-in-out infinite alternate; }
      #warn[hidden] { display: none; }
      #warnframe { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px 20px #ff1f2f99; animation: blink .5s ease-in-out infinite alternate; }
      #warnframe[hidden] { display: none; }
      #windnote { position: fixed; top: 25%; left: 50%; transform: translateX(-50%); padding: 6px 18px; border-radius: 999px; background: #8fa3b8dd; color: #0e1430; font-size: 1rem; font-weight: 700; pointer-events: none; }
      #windnote[hidden] { display: none; }
      @keyframes blink { from { opacity: .45; } to { opacity: 1; } }

      /* ---------- Màn hình phủ ---------- */
      #screens { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(14, 20, 48, 0.86); }
      #screens[hidden] { display: none; }
      .card { max-width: 680px; width: 92vw; margin: 16px; padding: 24px 32px; max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; border: 1px solid #ffb34766; border-radius: 16px; background: #1b2350ee; box-shadow: 0 0 60px #ffb34733; font-size: 1rem; }
      .card h1 { margin: 0 0 8px; font-size: 1.8rem; color: var(--gold); }
      .card h2 { margin: 16px 0 8px; font-size: 1.15rem; color: var(--lantern); }
      .card p, .card li { line-height: 1.5; font-size: 1rem; margin: 6px 0; }
      .card ul { margin: 0; padding-left: 22px; }
      .card blockquote { margin: 10px 0; padding: 10px 14px; border-left: 3px solid var(--gold); background: #ffffff0d; border-radius: 0 8px 8px 0; font-style: italic; font-size: 1rem; }
      .eyebrow { color: var(--lantern); letter-spacing: 2px; text-transform: uppercase; font-size: 0.9rem; margin: 0; font-weight: 700; }
      .big { font-size: 1.2rem; }
      .muted { opacity: .78; font-size: 0.95rem; }
      .keys { font-size: 0.95rem; opacity: .92; }
      kbd { background: #ffffff1a; border: 1px solid #ffffff33; border-radius: 4px; padding: 0 6px; font-family: ui-monospace, Consolas, monospace; margin: 0 1px; }
      .btns { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 6px; }
      .btns.col { flex-direction: column; }
      button { padding: 10px 24px; font-size: 1rem; border: 0; border-radius: 999px; background: var(--lantern); color: #2a1a05; cursor: pointer; font-weight: 700; }
      button:hover { background: var(--core); }
      button.alt { background: #ffffff1a; color: var(--text); border: 1px solid #ffffff44; }
      button.alt:hover { background: #ffffff33; }
      label { display: flex; justify-content: space-between; margin-top: 12px; font-weight: 600; font-size: 1rem; }
      input[type="range"] { width: 100%; accent-color: var(--lantern); }

      /* ---------- Đổi phím & Bảng xếp hạng ---------- */
      .key-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px 16px; margin-top: 8px; }
      .key-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 8px; background: #ffffff0a; }
      .key-btn { padding: 5px 14px; min-width: 84px; font-size: 0.95rem; }
      .key-btn.listening { background: var(--gold); color: #1b1200; border-color: var(--gold); }
      .key-btn.dup { border-color: var(--danger); color: var(--danger); }
      .conflict-warn { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: #ff5a5f22; border: 1px solid var(--danger); color: var(--danger); font-weight: 700; font-size: 0.95rem; }
      .lb-form { margin: 12px 0; padding: 12px; border-radius: 10px; background: #ffffff0a; border: 1px solid #ffffff22; }
      .lb-row { display: flex; gap: 8px; margin-top: 8px; }
      .lb-row input[type="text"] { flex: 1; padding: 8px 12px; font-size: 1rem; border-radius: 8px; border: 1px solid var(--gold); background: #0e1430; color: var(--text); }
      .lb-saved { color: var(--gold); font-weight: 700; }
      .lb-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.95rem; }
      .lb-table th, .lb-table td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #ffffff22; }
      .lb-table th { color: var(--lantern); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hudhost"></div>
    <div id="warnframe" hidden></div>
    <div id="warn" hidden></div>
    <div id="windnote" hidden></div>
    <div id="screens" hidden></div>
    <script type="module" src="/src/render/main.ts"></script>
  </body>
</html>
