<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a1a; }
      #hud { position: fixed; top: 8px; left: 12px; color: #ffd98a; font: 14px/1.5 monospace; pointer-events: none; white-space: pre; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(11, 10, 26, 0.82); color: #ffe9bd; font-family: system-ui, sans-serif; }
      #overlay[hidden] { display: none; }
      #overlay .card { max-width: 560px; margin: 16px; padding: 24px 32px; max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; border: 1px solid #ffb34766; border-radius: 16px; background: #1d1a45ee; box-shadow: 0 0 60px #ffb34733; }
      #overlay h1 { margin: 0 0 4px; font-size: 34px; color: #ffc766; }
      #overlay h2 { margin: 18px 0 6px; font-size: 16px; color: #ffb347; }
      #overlay p, #overlay li { line-height: 1.55; font-size: 15px; margin: 4px 0; }
      #overlay ul { margin: 0; padding-left: 20px; }
      #overlay kbd { background: #ffffff1a; border: 1px solid #ffffff33; border-radius: 4px; padding: 0 6px; font-family: monospace; }
      #overlay button { margin-top: 14px; padding: 10px 28px; font-size: 16px; border: 0; border-radius: 999px; background: #ffb347; color: #2a1a05; cursor: pointer; font-weight: 600; }
      #overlay button:hover { background: #ffc766; }
      #overlay .big { font-size: 20px; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/render/main.ts"></script>
  </body>
</html>
