<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <style>
      :root {
        --sky: #0e1430; --fog: #1b2350; --lantern: #ffb347; --core: #ffe9b0; --off: #5b5f6e;
        --mote: #fff6c2; --halo: #ffe58a; --gold: #f2c14e; --danger: #ff5a5f; --text: #f5f1e6; --scarf: #c8102e;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--text); font-family: system-ui, "Segoe UI", sans-serif; }
      canvas { display: block; }

      /* ---------- HUD ---------- */
      #hud-root { position: fixed; inset: 0; pointer-events: none; user-select: none; }
      #hud-root[hidden] { display: none; }
      #hud-tl { position: absolute; top: 14px; left: 18px; }
      #hud-flames { display: flex; gap: 4px; }
      .flame { display: inline-flex; color: var(--lantern); filter: drop-shadow(0 0 6px #ffb34799); }
      .flame.off { color: #3a3450; filter: none; }
      #hud-night { margin-top: 4px; font-size: 13px; opacity: .8; }
      #hud-timer { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font: 700 34px/1 ui-monospace, Consolas, monospace; letter-spacing: 2px; text-shadow: 0 0 10px #0008; }
      #hud-timer.low { color: var(--danger); animation: blink .6s ease-in-out infinite alternate; }
      #hud-tr { position: absolute; top: 14px; right: 20px; text-align: right; }
      #hud-lanterns { font-size: 18px; color: var(--lantern); font-weight: 600; }
      #hud-score { font: 700 30px/1.1 ui-monospace, Consolas, monospace; color: var(--gold); }
      #hud-prompt { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); padding: 7px 18px; border-radius: 999px; background: #0e1430cc; border: 1px solid var(--gold); color: var(--core); font-weight: 600; }
      #hud-prompt[hidden] { display: none; }
      #hud-motes { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
      .cell { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--gold); background: #0e143099; }
      .cell.on { background: radial-gradient(circle, var(--mote) 30%, var(--halo) 100%); box-shadow: 0 0 10px var(--halo); }
      #hud-br { position: absolute; bottom: 22px; right: 22px; display: flex; gap: 14px; align-items: flex-end; }
      #hud-charm { position: absolute; right: 0; bottom: 92px; width: 160px; text-align: right; color: var(--gold); font-weight: 600; }
      .cd { position: relative; width: 64px; height: 64px; border-radius: 50%; background: #0e1430cc; border: 2px solid var(--gold); text-align: center; }
      .cd.ready { box-shadow: 0 0 12px var(--gold); }
      .cd-ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(#000a var(--p, 0deg), transparent 0); }
      .cd-key { position: absolute; top: 8px; left: 0; right: 0; font: 700 22px/1 ui-monospace, Consolas, monospace; color: var(--core); }
      .cd-label { position: absolute; bottom: 6px; left: 0; right: 0; font-size: 10px; opacity: .85; }
      .cd-time { position: absolute; top: 30px; left: 0; right: 0; font: 700 14px/1 ui-monospace, Consolas, monospace; color: var(--text); }
      #hud-arrow { position: absolute; left: 0; top: 0; margin: -17px 0 0 -17px; color: var(--lantern); text-align: center; filter: drop-shadow(0 0 6px #000a); }
      #hud-arrow[hidden] { display: none; }
      #hud-arrow svg { display: block; transition: transform .05s linear; }
      #hud-arrow-label { font-size: 11px; }
      #hud-fps { position: absolute; top: 70px; left: 18px; font: 12px ui-monospace, Consolas, monospace; opacity: .8; }

      /* ---------- Cảnh báo lốc xoáy ---------- */
      #warn { position: fixed; top: 16%; left: 50%; transform: translateX(-50%); padding: 10px 26px; border-radius: 999px; background: #c0141fe6; color: #fff; font: 700 clamp(14px, 2.4vw, 20px) system-ui, sans-serif; white-space: nowrap; letter-spacing: .5px; pointer-events: none; box-shadow: 0 0 30px #ff2a2a; animation: blink .5s ease-in-out infinite alternate; }
      #warn[hidden] { display: none; }
      #warnframe { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px 20px #ff1f2f99; animation: blink .5s ease-in-out infinite alternate; }
      #warnframe[hidden] { display: none; }
      #windnote { position: fixed; top: 24%; left: 50%; transform: translateX(-50%); padding: 6px 18px; border-radius: 999px; background: #8fa3b8dd; color: #0e1430; font-weight: 700; pointer-events: none; }
      #windnote[hidden] { display: none; }
      @keyframes blink { from { opacity: .45; } to { opacity: 1; } }

      /* ---------- Màn hình phủ ---------- */
      #screens { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(14, 20, 48, 0.86); }
      #screens[hidden] { display: none; }
      .card { max-width: 600px; margin: 16px; padding: 24px 32px; max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; border: 1px solid #ffb34766; border-radius: 16px; background: #1b2350ee; box-shadow: 0 0 60px #ffb34733; }
      .card h1 { margin: 0 0 6px; font-size: 34px; color: var(--gold); }
      .card h2 { margin: 16px 0 6px; font-size: 16px; color: var(--lantern); }
      .card p, .card li { line-height: 1.55; font-size: 15px; margin: 4px 0; }
      .card ul { margin: 0; padding-left: 20px; }
      .card blockquote { margin: 10px 0; padding: 10px 14px; border-left: 3px solid var(--gold); background: #ffffff0d; border-radius: 0 8px 8px 0; font-style: italic; }
      .eyebrow { color: var(--lantern); letter-spacing: 2px; text-transform: uppercase; font-size: 12px; margin: 0; }
      .big { font-size: 20px; }
      .muted { opacity: .7; }
      .keys { font-size: 13px; opacity: .9; }
      kbd { background: #ffffff1a; border: 1px solid #ffffff33; border-radius: 4px; padding: 0 6px; font-family: ui-monospace, Consolas, monospace; margin: 0 1px; }
      .btns { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 6px; }
      .btns.col { flex-direction: column; }
      button { padding: 10px 26px; font-size: 16px; border: 0; border-radius: 999px; background: var(--lantern); color: #2a1a05; cursor: pointer; font-weight: 700; }
      button:hover { background: var(--core); }
      button.alt { background: #ffffff1a; color: var(--text); border: 1px solid #ffffff44; }
      button.alt:hover { background: #ffffff33; }
      label { display: flex; justify-content: space-between; margin-top: 14px; font-weight: 600; }
      input[type="range"] { width: 100%; accent-color: var(--lantern); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hudhost"></div>
    <div id="warnframe" hidden></div>
    <div id="warn" hidden></div>
    <div id="windnote" hidden></div>
    <div id="screens" hidden></div>
    <script type="module" src="/src/render/main.ts"></script>
  </body>
</html>
